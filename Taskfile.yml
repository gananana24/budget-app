# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  DEV_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/budget_app_dev?sslmode=disable
  TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/budget_app_test?sslmode=disable

tasks:
  default:
    desc: Show available development workflow tasks
    cmds:
      - task --list

  db:start:
    desc: Start the local PostgreSQL container
    cmds:
      - docker compose up -d --wait postgres

  db:stop:
    desc: Stop the local PostgreSQL container without deleting data
    cmds:
      - docker compose stop postgres

  db:reset:
    desc: Recreate the local development and test databases
    cmds:
      - docker compose down --volumes
      - task db:start
      - task db:migrate
      - task db:migrate:test

  db:migrate:
    desc: Apply migrations to the local development database
    cmds:
      - pnpm exec dbmate --url '{{.DEV_DATABASE_URL}}' --no-dump-schema up

  db:migrate:test:
    desc: Apply migrations to the local test database
    cmds:
      - pnpm exec dbmate --url '{{.TEST_DATABASE_URL}}' --no-dump-schema up

  db:dump:
    desc: Regenerate db/schema.sql from the local development database
    cmds:
      - pnpm exec dbmate --url '{{.DEV_DATABASE_URL}}' dump

  db:status:
    desc: Show local development database migration status
    cmds:
      - pnpm exec dbmate --url '{{.DEV_DATABASE_URL}}' --no-dump-schema status

  dev:
    desc: Start the database, apply migrations, and run the app locally
    cmds:
      - task: db:start
      - task: db:migrate
      - pnpm dev

  start:issue:
    desc: Update main and create a linked issue/<number> branch
    cmds:
      - pnpm exec tsx scripts/issue-workflow.ts start {{.CLI_ARGS}}

  create:pr:
    desc: Check, push, and create a Draft Pull Request for the current Issue branch
    cmds:
      - pnpm exec tsx scripts/issue-workflow.ts create-pr

  ready:pr:
    desc: Check the current Pull Request and enable squash auto-merge
    cmds:
      - pnpm exec tsx scripts/issue-workflow.ts ready-pr

  clean:issue:
    desc: Update main and remove a merged local Issue branch
    cmds:
      - pnpm exec tsx scripts/issue-workflow.ts clean {{.CLI_ARGS}}
